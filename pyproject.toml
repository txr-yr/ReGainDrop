[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regaindrop"
version = "0.1.0"
description = "ReGainDrop visual-token pruning research code (author snapshot)"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {file = "LICENSE"}
dependencies = [
    "torch==2.1.2", "torchvision==0.16.2", "transformers==4.37.2",
    "tokenizers==0.15.1", "sentencepiece==0.1.99", "shortuuid",
    "accelerate==0.21.0", "peft==0.7.1", "numpy<2",
    "scikit-learn==1.2.2", "einops==0.6.1", "einops-exts==0.0.4",
    "timm==0.6.13", "protobuf", "Pillow", "requests", "tqdm"
]

[project.optional-dependencies]
eval = ["pandas", "openpyxl", "matplotlib", "pyarrow"]
quantization = ["bitsandbytes"]
serve = ["gradio==4.16.0", "gradio_client==0.8.1", "httpx==0.24.0", "uvicorn", "fastapi", "markdown2[all]"]

[project.urls]
Repository = "https://github.com/txr-yr/ReGainDrop"

[tool.setuptools.packages.find]
include = ["llava*"]
exclude = ["qwen2_5_vl*", "scripts*", "tests*", "docs*"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "third_party_licenses/*"]
